<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>COGNAPSE Icon Generator</title>
  <style>
    body {
      background-color: #030712;
      color: #f3f4f6;
      font-family: sans-serif;
      text-align: center;
      padding: 40px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #090d16;
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 30px;
      border-radius: 8px;
    }
    .canvas-row {
      display: flex;
      justify-content: center;
      align-items: bottom;
      gap: 30px;
      margin: 40px 0;
    }
    .canvas-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    canvas {
      background: #000;
      border: 1px dashed rgba(255,255,255,0.1);
    }
    button {
      padding: 12px 24px;
      background: #f97316;
      color: #fff;
      border: none;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    button:hover {
      background: #ea580c;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>COGNAPSE Chrome Extension Icon Generator</h2>
    <p>This utility generates web-store-ready, high-fidelity PNG icons from our canvas design system.</p>
    
    <div class="canvas-row">
      <div class="canvas-box">
        <canvas id="c128" width="128" height="128"></canvas>
        <span>128 x 128 px</span>
      </div>
      <div class="canvas-box">
        <canvas id="c48" width="48" height="48"></canvas>
        <span>48 x 48 px</span>
      </div>
      <div class="canvas-box">
        <canvas id="c16" width="16" height="16"></canvas>
        <span>16 x 16 px</span>
      </div>
    </div>

    <button id="btn-generate">Download Icon Pack</button>
  </div>

  <script>
    function drawIcon(canvasId, size) {
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext('2d');
      
      // Clear
      ctx.clearRect(0, 0, size, size);
      
      // Dark Base background circle
      ctx.fillStyle = '#090d16';
      ctx.beginPath();
      ctx.arc(size / 2, size / 2, size / 2 - 1, 0, Math.PI * 2);
      ctx.fill();
      
      // Cyber Glowing Outer Ring
      ctx.strokeStyle = '#f97316';
      ctx.lineWidth = Math.max(1, size * 0.05);
      ctx.beginPath();
      ctx.arc(size / 2, size / 2, size / 2 - size * 0.08, 0, Math.PI * 2);
      ctx.stroke();

      // Inner Glowing Core Gradient
      const grad = ctx.createRadialGradient(
        size / 2, size / 2, size * 0.05, 
        size / 2, size / 2, size * 0.4
      );
      grad.addColorStop(0, 'rgba(249, 115, 22, 0.4)');
      grad.addColorStop(1, 'rgba(249, 115, 22, 0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(size / 2, size / 2, size * 0.4, 0, Math.PI * 2);
      ctx.fill();

      // Draw Stylized Cyber Lock/Omega Symbol
      ctx.strokeStyle = '#f97316';
      ctx.fillStyle = '#ffffff';
      ctx.lineWidth = Math.max(1, size * 0.06);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      const cx = size / 2;
      const cy = size / 2;
      const r = size * 0.16;

      // Draw Keyhole / Arch
      ctx.beginPath();
      ctx.arc(cx, cy - size * 0.04, r, Math.PI * 0.8, Math.PI * 2.2);
      // Leg down-left
      ctx.lineTo(cx - r * 0.8, cy + size * 0.15);
      ctx.lineTo(cx + r * 0.8, cy + size * 0.15);
      ctx.closePath();
      ctx.stroke();
      
      // Center Glow Dot
      ctx.fillStyle = '#f97316';
      ctx.beginPath();
      ctx.arc(cx, cy - size * 0.04, r * 0.4, 0, Math.PI * 2);
      ctx.fill();
    }

    // Draw all
    drawIcon('c128', 128);
    drawIcon('c48', 48);
    drawIcon('c16', 16);

    // Download Handler
    document.getElementById('btn-generate').addEventListener('click', () => {
      const sizes = [128, 48, 16];
      sizes.forEach(size => {
        const canvas = document.getElementById(`c${size}`);
        const link = document.createElement('a');
        link.download = `icon${size}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    });
  </script>
</body>
</html>
