    <!-- CONTENT SECURITY POLICY — Hardened for production; covers Firebase, Razorpay, GA4, and Vite dev servers -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://checkout.razorpay.com https://cdn.razorpay.com https://va.vercel-scripts.com https://www.googletagmanager.com https://cdn.jsdelivr.net; worker-src 'self' blob: https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; connect-src 'self' http://localhost:* http://127.0.0.1:* ws://localhost:* https://* wss://*; img-src 'self' data: https://* blob:; media-src 'self' data:; font-src 'self' data: https://fonts.gstatic.com https://*; frame-src 'self' https://*;" />

    <!-- Aura SDK analytics removed — all telemetry handled by opsTelemetry.ts -->

    <!-- Stale chunk detection — force-reload when deployment hash changes cause dynamic import failures -->
    <script>
      (function() {
        if (window.__cognapse_reloaded) return;
        window.addEventListener('unhandledrejection', function(e) {
          if (e.reason && typeof e.reason.message === 'string' &&
              e.reason.message.includes('imported module')) {
            window.__cognapse_reloaded = true;
            window.location.reload();
          }
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Telemetry is now managed by the compiled TypeScript module at src/services/opsTelemetry.ts -->
  </body>
</html>
